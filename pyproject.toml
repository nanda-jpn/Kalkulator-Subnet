[project]
name = "subnet-calculator"
version = "0.1.0"
description = "Kalkulator subnet IPv4 dan VLSM untuk pembelajaran jaringan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["test_main.py"]
